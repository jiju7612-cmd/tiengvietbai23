<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiếng Việt · 베트남어 복습</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fff6e5; --card:#ffffff; --ink:#2b2340; --muted:#6b6485;
  --accent:#ff6b6b; --accent2:#4d7cfe; --good:#1fb36b; --bad:#e5484d;
  --line:#2b2340; --chip:#ffe08a; --shadow:#2b2340;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1730; --card:#2a2447; --ink:#fff4dc; --muted:#b9b1d6;
    --accent:#ff7b7b; --accent2:#7ea2ff; --good:#3ddc97; --bad:#ff6b70;
    --line:#fff4dc; --chip:#5b4a1f; --shadow:#000;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1730; --card:#2a2447; --ink:#fff4dc; --muted:#b9b1d6;
  --accent:#ff7b7b; --accent2:#7ea2ff; --good:#3ddc97; --bad:#ff6b70;
  --line:#fff4dc; --chip:#5b4a1f; --shadow:#000;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2","Segoe UI",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background-image:radial-gradient(var(--chip) 1.5px,transparent 1.5px);background-size:26px 26px}
#app{max-width:860px;margin:0 auto;padding:14px 14px 28px;min-height:100vh;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:10px;min-height:38px}
.bar{flex:1;height:14px;border:3px solid var(--line);border-radius:99px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.pill{border:3px solid var(--line);background:var(--card);border-radius:99px;padding:3px 12px;font-weight:800;white-space:nowrap;box-shadow:3px 3px 0 var(--shadow);font:inherit;font-weight:800;color:inherit}
button.pill{cursor:pointer}
.slide{background:var(--card);border:4px solid var(--line);border-radius:22px;box-shadow:7px 7px 0 var(--shadow);padding:22px 20px;display:flex;flex-direction:column;gap:14px;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
.tag{align-self:flex-start;background:var(--accent2);color:#fff;border-radius:99px;padding:3px 14px;font-weight:800;font-size:.9rem;border:3px solid var(--line)}
h1{font-size:clamp(1.9rem,7vw,3rem);margin:0;line-height:1.1}
h2{font-size:clamp(1.2rem,4.5vw,1.8rem);margin:0;line-height:1.25}
h3{margin:0;font-size:1.2rem}
.ko{color:var(--muted);font-weight:600}
.big{font-size:clamp(4rem,18vw,7rem);text-align:center;line-height:1}
button{font:inherit;color:inherit;cursor:pointer}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{border:3px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;font-weight:800;font-size:1.08rem;box-shadow:4px 4px 0 var(--shadow);transition:transform .08s}
.opt:hover:not(:disabled){transform:translate(-1px,-1px)}
.opt:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.opt.good{background:var(--good);color:#fff}.opt.bad{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.next{align-self:flex-end;border:3px solid var(--line);background:var(--accent);color:#fff;border-radius:99px;padding:10px 26px;font-weight:800;font-size:1.1rem;box-shadow:4px 4px 0 var(--shadow)}
.next:disabled{opacity:.35;cursor:not-allowed}
.fb{min-height:1.6em;font-weight:800;font-size:1.05rem}
.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.pat{border-left:8px solid var(--accent);background:var(--bg);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.pat b{font-size:1.12rem}
.hl{background:var(--chip);border-radius:6px;padding:0 6px;font-weight:800}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{border:3px solid var(--line);background:var(--chip);border-radius:12px;padding:8px 14px;font-weight:800;font-size:1.05rem;box-shadow:3px 3px 0 var(--shadow)}
.chip.sel{outline:4px solid var(--accent2)}.chip.done{background:var(--good);color:#fff;opacity:.55;cursor:default}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tray{min-height:62px;border:3px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row{display:flex;gap:8px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.btn2{border:3px solid var(--line);background:var(--accent2);color:#fff;border-radius:99px;padding:8px 20px;font-weight:800;box-shadow:3px 3px 0 var(--shadow)}
.stars{font-size:3rem;text-align:center}
.score{font-size:clamp(2.5rem,10vw,4.5rem);font-weight:900;text-align:center}
/* menu */
.lgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.lcard{border:4px solid var(--line);border-radius:18px;background:var(--bg);padding:16px;text-align:left;box-shadow:5px 5px 0 var(--shadow);display:flex;flex-direction:column;gap:6px}
.lcard:hover{transform:translate(-2px,-2px)}
.lcard .em{font-size:2.6rem}
.lcard b{font-size:1.25rem}
.mbtn{display:flex;align-items:center;gap:14px;border:4px solid var(--line);border-radius:18px;padding:16px;background:var(--bg);box-shadow:5px 5px 0 var(--shadow);text-align:left}
.mbtn .em{font-size:2.4rem}.mbtn b{font-size:1.2rem;display:block}.mbtn span{color:var(--muted);font-weight:600;font-size:.9rem}
.mbtn:hover{transform:translate(-2px,-2px)}
/* flashcard */
.fcard{border:4px solid var(--line);border-radius:22px;background:var(--bg);min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;cursor:pointer;box-shadow:5px 5px 0 var(--shadow);user-select:none;animation:pop .2s ease}
.fcard .vi{font-size:clamp(2rem,9vw,3.4rem);font-weight:900;line-height:1.15}
.fcard .hint{color:var(--muted);font-weight:700}
.fcard .kr{font-size:clamp(1.5rem,6vw,2.2rem);font-weight:900}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fb1{border:3px solid var(--line);border-radius:16px;padding:14px;font-weight:800;font-size:1.1rem;box-shadow:4px 4px 0 var(--shadow)}
.fb1.no{background:var(--bad);color:#fff}.fb1.yes{background:var(--good);color:#fff}
.stat{display:flex;justify-content:space-between;font-weight:800;flex-wrap:wrap;gap:6px}
.small{font-size:.85rem;color:var(--muted);font-weight:600}
</style>
</head>
<body>
<div id="app">
  <div class="top" id="top"></div>
  <div id="stage"></div>
</div>
<script>
"use strict";
/* ============ TIỆN ÍCH ============ */
const $ = s => document.querySelector(s);
const stage = $("#stage");
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const M = (q,a,w,ex,big)=>({q,a,w,ex,big});
const O = (s,ko)=>({s,ko});
const mem = {};
function store(k,v){
  if(v===undefined){ try{ return JSON.parse(localStorage.getItem(k)||"[]"); }catch(e){ return mem[k]||[]; } }
  try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ mem[k]=v; }
}
/* Bốc đề: không lặp lại cho tới khi dùng hết ngân hàng, rồi mới xoay vòng */
function draw(key,n,take){
  take=Math.min(take,n);
  let used=store(key).filter(i=>i<n);
  const all=[...Array(n).keys()];
  const free=all.filter(i=>!used.includes(i));
  let pick;
  if(free.length>=take){ pick=shuffle(free).slice(0,take); used=used.concat(pick); }
  else { pick=free.slice(); const rest=all.filter(i=>!pick.includes(i)); pick=pick.concat(shuffle(rest).slice(0,take-pick.length)); used=pick.slice(); }
  store(key,used);
  return pick;
}
function setTop(back,game){
  $("#top").innerHTML=(back?'<button class="pill" id="back">← Quay lại 뒤로</button>':'')+
    (game?'<div class="bar"><i id="prog"></i></div><div class="pill" id="sc"></div>':'<div style="flex:1"></div>');
  if(back) $("#back").onclick=back;
}
function wrap(html){ stage.innerHTML=`<div class="slide">${html}</div>`; window.scrollTo(0,0); }

const flag = n => NATS.find(x=>x[0]===n)[1];

  stage.querySelectorAll(".lcard").forEach(b=>b.onclick=()=>lessonMenu(LESSONS.find(l=>l.id===b.dataset.id)));
}
const bankSize = L => L.rounds.reduce((s,r)=>s+r.items.length,0);
function lessonMenu(L){
  setTop(home,false);
  wrap(`<div class="tag">Bài ${L.no}</div><h1>${L.title}</h1><h2 class="ko">${L.ko}</h2>
  <div class="col">
   <button class="mbtn" id="m1"><div class="em">🃏</div><div><b>낱말 · Flashcard</b><span>${L.vocab.length} từ · 단어 카드</span></div></button>
   <button class="mbtn" id="m2"><div class="em">📖</div><div><b>Ngữ pháp 문법</b><span>${L.grammar.length} mục · 문법·문형 정리</span></div></button>
   <button class="mbtn" id="m3"><div class="em">🎮</div><div><b>Game 게임</b><span>Ngân hàng ${bankSize(L)} câu · 매번 새로운 문제</span></div></button>
  </div>
  <button class="pill" id="rs" style="align-self:flex-start;font-size:.85rem">🔄 Làm mới ngân hàng đề 문제 은행 초기화</button>
  <div class="small" id="rsmsg"></div>`);
  $("#m1").onclick=()=>flash(L); $("#m2").onclick=()=>gram(L); $("#m3").onclick=()=>startGame(L);
  $("#rs").onclick=()=>{ L.rounds.forEach((r,i)=>store(L.id+":"+i,[])); $("#rsmsg").textContent="Đã làm mới: các câu hỏi có thể xuất hiện lại. 초기화 완료!"; };
}

/* ---- Ngữ pháp ---- */
function gram(L){
  setTop(()=>lessonMenu(L),false);
  wrap(`<div class="tag">Bài ${L.no} · Ngữ pháp 문법</div>${L.grammar.map(g=>`<h3>${g.h}</h3>${g.html}`).join("")}
  <button class="next" id="g">Chơi game 🎮 게임하기</button>`);
  $("#g").onclick=()=>startGame(L);
}

/* ---- Flashcard (낱말) ---- */
function flash(L){
  setTop(()=>lessonMenu(L),false);
  const total=L.vocab.length;
  let queue=shuffle([...Array(total).keys()]), known=0, flipped=false;
  function paint(){
    if(!queue.length){
      wrap(`<div class="tag">Bài ${L.no} · 낱말 Flashcard</div><div class="stars">🎉</div><h2 style="text-align:center">Bạn đã nhớ hết ${total} từ! 모든 단어를 외웠어요!</h2>
      <div class="row" style="justify-content:center"><button class="btn2" id="again">Học lại 다시 학습 🔁</button></div>`);
      $("#again").onclick=()=>flash(L); return;
    }
    const v=L.vocab[queue[0]];
    wrap(`<div class="tag">Bài ${L.no} · 낱말 Flashcard</div>
    <div class="stat"><span>✅ Nhớ rồi 외움: ${known}/${total}</span><span>📥 Còn lại 남음: ${queue.length}</span></div>
    <div class="fcard" id="card">${flipped
      ?`<div class="big">${v[1]}</div><div class="kr">${v[2]}</div><div class="hint">${v[0]}</div>`
      :`<div class="vi">${v[0]}</div><div class="hint">👆 Nhấp để xem nghĩa · 눌러서 뜻 보기</div>`}</div>
    <div class="fbtns"><button class="fb1 no" id="no">Chưa 😅<br><small>아직</small></button><button class="fb1 yes" id="yes">Nhớ rồi 😎<br><small>외웠어요</small></button></div>`);
    $("#card").onclick=()=>{ flipped=!flipped; paint(); };
    $("#no").onclick=()=>{ queue.push(queue.shift()); flipped=false; paint(); };
    $("#yes").onclick=()=>{ queue.shift(); known++; flipped=false; paint(); };
  }
  paint();
}

/* ---- Game ---- */
let G=null;
function buildGame(L){
  const sl=[];
  const pool=shuffle(L.vocab.filter(v=>!v[3]));
  for(let i=0;i<3;i++) sl.push({t:"match",tag:`Vòng 1 · Nối cặp 짝 맞추기 (${i+1}/3)`,pairs:pool.slice(i*6,i*6+6).map(v=>[v[0],v[2]])});
  L.rounds.forEach((r,ri)=>{
    const idx=draw(L.id+":"+ri,r.items.length,r.take);
    idx.forEach(i=>{
      const it=r.items[i], tag=`Vòng ${ri+2} · ${r.name}`;
      if(r.kind==="order"){
        const toks=it.s.replace(/[?.]$/,"").split(" ");
        sl.push({t:"order",tag,ans:it.s,ko:it.ko,toks:shuffle(toks)});
      } else {
        const w=typeof it.w==="function"?it.w():it.w;
        sl.push({t:"mcq",tag,q:(r.qprefix||"")+it.q,big:it.big,opts:shuffle([it.a,...w]),a:it.a,ex:it.ex});
      }
    });
  });
  sl.push({t:"result"});
  return sl;
}
function startGame(L){
  setTop(()=>lessonMenu(L),true);
  const slides=buildGame(L);
  let max=0; slides.forEach(s=>{ if(s.t==="mcq"||s.t==="order") max+=1; if(s.t==="match") max+=s.pairs.length; });
  G={L,slides,idx:0,score:0,max,locked:false};
  gRender();
}
function gScore(){ $("#sc").textContent="⭐ "+G.score+" / "+G.max; $("#prog").style.width=(G.idx/(G.slides.length-1)*100)+"%"; }
function gRender(){ G.locked=false; gScore(); const s=G.slides[G.idx]; ({mcq:gMcq,match:gMatch,order:gOrder,result:gResult})[s.t](s); }
const nextBtn=()=>`<button class="next" id="nx" disabled>Tiếp 다음 ▶</button>`;
function gWrap(html){ wrap(html); const n=$("#nx"); if(n) n.onclick=()=>{G.idx++; gRender();}; }

function gMcq(s){
  gWrap(`<div class="tag">${s.tag}</div>${s.big?`<div class="big">${s.big}</div>`:""}<h2>${s.q}</h2>
  <div class="opts">${s.opts.map(o=>`<button class="opt">${o}</button>`).join("")}</div><div class="fb" id="fb"></div>${nextBtn()}`);
  const bs=[...stage.querySelectorAll(".opt")];
  bs.forEach(b=>b.onclick=()=>{
    if(G.locked) return; G.locked=true;
    const ok=b.textContent===s.a;
    bs.forEach(x=>{x.disabled=true; if(x.textContent===s.a) x.classList.add("good");});
    if(ok){G.score++; $("#fb").className="fb good"; $("#fb").textContent="✅ Chính xác! 정답! "+(s.ex||"");}
    else{b.classList.add("bad"); $("#fb").className="fb bad"; $("#fb").textContent="❌ Chưa đúng 오답 — "+(s.ex||"");}
    gScore(); $("#nx").disabled=false;
  });
}
/* Matching: KHÔNG có hình, chỉ chữ */
function gMatch(s){
  const L=shuffle(s.pairs.map(p=>p[0])), R=shuffle(s.pairs.map(p=>p[1]));
  gWrap(`<div class="tag">${s.tag}</div><h2>Nối từ tiếng Việt với nghĩa tiếng Hàn<br><span class="ko">베트남어와 한국어 뜻을 연결하세요</span></h2>
  <div class="cols"><div class="col" id="L">${L.map(x=>`<button class="chip" data-v="${x}">${x}</button>`).join("")}</div>
  <div class="col" id="R">${R.map(x=>`<button class="chip" data-v="${x}">${x}</button>`).join("")}</div></div>
  <div class="fb" id="fb"></div>${nextBtn()}`);
  const map=Object.fromEntries(s.pairs);
  let sel=null, done=0, miss=0;
  stage.querySelectorAll("#L .chip").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("done")) return;
    stage.querySelectorAll("#L .chip").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel=b;
  });
  stage.querySelectorAll("#R .chip").forEach(b=>b.onclick=()=>{
    if(!sel||b.classList.contains("done")) return;
    if(map[sel.dataset.v]===b.dataset.v){
      sel.classList.remove("sel"); sel.classList.add("done"); b.classList.add("done"); sel=null; done++;
      if(done===s.pairs.length){ const g=Math.max(0,s.pairs.length-miss); G.score+=g; $("#fb").className="fb good"; $("#fb").textContent=`🎉 Xong! +${g} ⭐ (sai ${miss} lần)`; gScore(); $("#nx").disabled=false; }
    } else { miss++; const a=sel; a.classList.add("shake"); b.classList.add("shake"); setTimeout(()=>{a.classList.remove("shake");b.classList.remove("shake")},300); }
  });
}
function gOrder(s){
  gWrap(`<div class="tag">${s.tag}</div><h2>Xếp các từ thành câu đúng<br><span class="ko">${s.ko}</span></h2>
  <div class="tray" id="tray"></div><div class="row" id="pool">${s.toks.map((t,i)=>`<button class="chip" data-i="${i}">${t}</button>`).join("")}</div>
  <div class="row"><button class="btn2" id="chk">Kiểm tra 확인</button><button class="btn2" id="rst" style="background:var(--muted)">Làm lại 다시</button></div>
  <div class="fb" id="fb"></div>${nextBtn()}`);
  const tray=$("#tray"), pool=$("#pool"); let used=[];
  function paint(){
    tray.innerHTML=used.map(i=>`<button class="chip" data-i="${i}">${s.toks[i]}</button>`).join("");
    pool.querySelectorAll(".chip").forEach(c=>{c.style.visibility=used.includes(+c.dataset.i)?"hidden":"visible";});
    tray.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ if(G.locked) return; used=used.filter(i=>i!==+c.dataset.i); paint(); });
  }
  pool.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ if(G.locked) return; used.push(+c.dataset.i); paint(); });
  $("#rst").onclick=()=>{ if(G.locked) return; used=[]; paint(); $("#fb").textContent=""; };
  $("#chk").onclick=()=>{
    if(G.locked) return;
    const got=used.map(i=>s.toks[i]).join(" "), want=s.ans.replace(/[?.]$/,"");
    if(got===want){ G.locked=true; G.score++; $("#fb").className="fb good"; $("#fb").textContent="✅ "+s.ans; gScore(); $("#nx").disabled=false; }
    else { $("#fb").className="fb bad"; $("#fb").textContent="❌ Thử lại nhé! 다시 해보세요"; tray.classList.add("shake"); setTimeout(()=>tray.classList.remove("shake"),300); }
  };
  paint();
}
function gResult(){
  const p=G.score/G.max;
  const msg=p>=.9?["🏆","Xuất sắc! 최고예요!"]:p>=.7?["🌟","Giỏi lắm! 잘했어요!"]:p>=.5?["👍","Khá tốt! 좋아요!"]:["💪","Cố lên! 조금만 더 힘내요!"];
  $("#prog").style.width="100%";
  wrap(`<div class="tag">Kết quả 결과 · Bài ${G.L.no}</div><div class="stars">${msg[0]}</div><div class="score">${G.score} / ${G.max}</div><h2 style="text-align:center">${msg[1]}</h2>
  <div class="row" style="justify-content:center"><button class="btn2" id="again">Chơi lại với đề mới 새 문제로 다시 🔁</button><button class="btn2" id="menu" style="background:var(--muted)">Về menu 메뉴</button></div>`);
  $("#again").onclick=()=>startGame(G.L); $("#menu").onclick=()=>lessonMenu(G.L);
}

home();
</script>
</body>
</html>
